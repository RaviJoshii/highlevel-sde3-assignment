services:
  mongodb:
    image: mongo:7.0
    container_name: opportunities-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opportunities-app
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/opportunities_crm
      - NODE_ENV=production
      - CHUNK_SIZE=500
      - CHUNK_PACING_MS=20
      - MAX_BATCH_SIZE=50000
      - LEASE_DURATION_MS=30000
      - HEARTBEAT_INTERVAL_MS=5000
      - WORKER_CONCURRENCY=2
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data:
